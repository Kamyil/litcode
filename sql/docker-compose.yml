# Postgres for the SQL track. Start with `lc sql up` (creates + seeds on first run).
services:
  postgres:
    image: postgres:17
    container_name: litcode-pg
    environment:
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: lc
      POSTGRES_DB: lc
    ports:
      - "54329:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb

volumes:
  pgdata:
